<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KindFare — Redesign Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E1C18; --sub:#6B6050; --blue:#4A6B8A; --gold:#d98816; --green:#4F7A63;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--ink);
    background:
      radial-gradient(at 12% 8%, #eef1f4 0, transparent 55%),
      radial-gradient(at 88% 6%, #f3ecdd 0, transparent 50%),
      radial-gradient(at 90% 90%, #e8efe6 0, transparent 55%),
      radial-gradient(at 8% 92%, #f5f2ea 0, transparent 50%),
      #EDEAE1;
    display:flex; flex-direction:column; align-items:center;
    padding:48px 20px 60px;
  }
  .badge{font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--sub);text-transform:uppercase}
  h1{font-family:ui-serif,Georgia,serif;font-size:27px;font-weight:700;margin:6px 0 2px;letter-spacing:-.3px}
  .sub{font-size:13.5px;color:var(--sub);font-weight:500;margin-bottom:26px;text-align:center}

  .switcher{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:660px;margin-bottom:32px}
  .switcher button{
    padding:9px 16px;border-radius:999px;border:1px solid rgba(30,28,24,.12);
    background:rgba(255,255,255,.7);backdrop-filter:blur(10px);
    font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  }
  .switcher button:hover{background:#fff}
  .switcher button.active{background:var(--blue);color:#fff;border-color:var(--blue)}

  .phone-wrap{display:flex;justify-content:center;max-width:100%}
  .phone{
    /* width is the FULL outer size (border-box, see the global reset above) — it must equal
       390px (the .screen's width) + 14px + 14px (this element's own left/right padding), or the
       bezel renders too narrow and the screen pokes out past its right edge. */
    position:relative;width:418px;padding:42px 14px 30px;border-radius:58px;
    background:linear-gradient(160deg,#2c2c32,#101013);
    box-shadow:0 45px 100px rgba(20,18,14,.38),0 10px 28px rgba(20,18,14,.2),inset 0 0 0 2px rgba(255,255,255,.07);
  }
  .notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:118px;height:30px;background:#000;border-radius:18px;z-index:5}
  /* .screen is the clip mask for the embedded app — position:relative + isolate + the -webkit-mask-image
     hack forces Safari/WebKit to actually respect border-radius+overflow:hidden clipping on an <iframe>
     child, which it otherwise ignores. Without this the iframe's own edge (incl. any native scrollbar)
     can bleed past the rounded corners. */
  .screen{
    position:relative;width:390px;height:844px;border-radius:42px;overflow:hidden;background:#0d0d10;
    isolation:isolate;transform:translateZ(0);-webkit-mask-image:-webkit-radial-gradient(white,black);
  }
  /* iframe is rendered wider+taller than the visible screen and pinned top-left, so if the embedded
     page's own scrollbar appears at its right/bottom edge, it lands in the overflow zone that .screen
     clips away — the visible 390x844 app content itself is untouched. */
  iframe{
    width:410px;height:864px;border:none;display:block;position:absolute;top:0;left:0;border-radius:42px;
  }
  .vol1{position:absolute;left:-2px;top:120px;width:3px;height:28px;background:#3a3a40;border-radius:2px 0 0 2px}
  .vol2{position:absolute;left:-2px;top:168px;width:3px;height:54px;background:#3a3a40;border-radius:2px 0 0 2px}
  .vol3{position:absolute;left:-2px;top:230px;width:3px;height:54px;background:#3a3a40;border-radius:2px 0 0 2px}
  .power{position:absolute;right:-2px;top:180px;width:3px;height:70px;background:#3a3a40;border-radius:0 2px 2px 0}

  .footer{margin-top:28px;font-size:12px;color:var(--sub);font-weight:500;text-align:center;max-width:420px;line-height:1.6}

  /* zoom (not transform:scale) so the shrunk phone's LAYOUT footprint actually shrinks too —
     transform:scale only shrinks what you see, not the space it reserves, which was cropping the
     phone against the edge of narrow browser windows instead of cleanly fitting it. */
  @media (max-width:480px){
    .phone-wrap{zoom:0.82}
  }
  @media (max-width:360px){
    .phone-wrap{zoom:0.72}
  }
</style>
</head>
<body>
  <div class="badge">KindFare™ · Prototype</div>
  <h1>Redesign Preview</h1>
  <div class="sub">Merged &amp; audited build — 12 Aug 2026</div>

  <div class="switcher" id="switcher"></div>

  <div class="phone-wrap">
    <div class="phone">
      <div class="vol1"></div><div class="vol2"></div><div class="vol3"></div>
      <div class="power"></div>
      <div class="screen">
        <div class="notch"></div>
        <iframe id="app-frame" src="KindFare%20Home%20Redesign.dc.html" title="KindFare app preview" scrolling="no" frameborder="0"></iframe>
      </div>
    </div>
  </div>

  <div class="footer">Tap the pills above to jump between screens, or use the app's own tab bar and links inside the phone itself — navigation between every screen is fully wired.</div>

  <script>
    const screens = [
      ['Home', 'KindFare Home Redesign.dc.html'],
      ['Shop', 'KindFare Shop Redesign.dc.html'],
      ['Plan', 'KindFare Plan Redesign.dc.html'],
      ['Exercises', 'KindFare Exercises Redesign.dc.html'],
      ['Profile', 'KindFare Profile Redesign.dc.html'],
      ['Apple Health', 'KindFare Apple Health Connect.dc.html'],
      ['Mia Chat', 'KindFare Mia Chat.dc.html'],
      ['Notifications', 'KindFare Notifications.dc.html'],
      ['Food Scanner', 'KindFare Food Scanner.dc.html'],
      ['Onboarding', 'KindFare Onboarding.dc.html'],
    ];
    const switcher = document.getElementById('switcher');
    const frame = document.getElementById('app-frame');
    screens.forEach(([label, file], i) => {
      const btn = document.createElement('button');
      btn.textContent = label;
      if (i === 0) btn.classList.add('active');
      btn.onclick = () => {
        frame.src = encodeURI(file);
        [...switcher.children].forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
      switcher.appendChild(btn);
    });
  </script>
</body>
</html>
