<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<script src="./kindfare-sound.js"></script>
<script src="./kindfare-i18n.js"></script>
<style>
  body{margin:0}
  [style*="overflow-y:auto"]::-webkit-scrollbar{display:none}
  [style*="overflow-y:auto"]{scrollbar-width:none}

  a{color:#4A6B8A}
  a:hover{color:#3a5670}
  @keyframes kf-drift1{0%{transform:translate(0,0) scale(1)} 33%{transform:translate(55px,70px) scale(1.25)} 66%{transform:translate(-30px,40px) scale(0.88)} 100%{transform:translate(0,0) scale(1)}}
  @keyframes kf-drift2{0%{transform:translate(0,0) scale(1)} 33%{transform:translate(-65px,45px) scale(1.2)} 66%{transform:translate(35px,-25px) scale(0.85)} 100%{transform:translate(0,0) scale(1)}}
  @keyframes kf-glow{0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)}}
  @keyframes kf-typing{0%,100%{opacity:.3;transform:translateY(0)} 50%{opacity:1;transform:translateY(-2px)}}
  @media (prefers-reduced-motion: reduce){ [style*="kf-drift"],[style*="kf-glow"]{animation:none !important} }

  :focus-visible{outline:2px solid #4A6B8A;outline-offset:2px;border-radius:4px}
  @keyframes kf-globe-spin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
</style>
</helmet>

<div style="width:390px;height:844px;position:relative;background:{{ outerBg }};overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:{{ textPrimary }};box-shadow:0 30px 70px rgba(0,0,0,.25)">

  <div style="position:absolute;inset:0;z-index:0;overflow:hidden">
    <div style="position:absolute;width:260px;height:260px;top:-60px;left:-70px;border-radius:50%;filter:blur(50px);opacity:{{ blobOpacity }};background:radial-gradient(circle,#e8ecf0 0%,#BDC9D6 70%,transparent 100%);animation:kf-drift1 11s ease-in-out infinite"></div>
    <div style="position:absolute;width:300px;height:300px;top:160px;right:-110px;border-radius:50%;filter:blur(50px);opacity:{{ blobOpacity }};background:radial-gradient(circle,#dde6d5 0%,#7fa06b 70%,transparent 100%);animation:kf-drift2 13s ease-in-out infinite"></div>
  </div>

  <div style="position:relative;z-index:1;height:47px;padding:0 26px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:8px;font-size:15px;font-weight:600;color:{{ textPrimary }}">
    <span>9:41</span>
    <span style="display:flex;gap:5px;align-items:center">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="currentColor"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".4"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="1" y="1" width="21" height="11" rx="3" stroke="currentColor" stroke-width="1"/><rect x="2.5" y="2.5" width="15" height="8" rx="1.5" fill="currentColor"/><rect x="23.5" y="4" width="1.6" height="5" rx="0.8" fill="currentColor"/></svg>
    </span>
  </div>

  <!-- sheet header -->
  <div style="position:relative;z-index:1;padding:6px 20px 14px;border-bottom:1px solid {{ hairline }}">
    <div style="width:36px;height:4px;border-radius:999px;background:{{ hairlineStrong }};margin:0 auto 14px"></div>
    <div style="display:flex;align-items:center;gap:12px">
      <span style="position:relative;width:46px;height:46px;flex-shrink:0">
        <span style="position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,#4A6B8A,#4F7A63,#d98816,#4A6B8A);opacity:.4;filter:blur(3px);animation:kf-glow 6s linear infinite"></span>
        <span style="position:relative;display:block;width:46px;height:46px;box-shadow:0 4px 12px rgba(74,107,138,.35)">
          <image-slot id="mia-chat-avatar" shape="circle" placeholder="Mia headshot" src="assets/img/mia-headshot.png"></image-slot>
        </span>
        <span style="position:absolute;bottom:-2px;right:-2px;width:13px;height:13px;border-radius:50%;background:#4F7A63;border:2px solid {{ outerBgSolid }}"></span>
      </span>
      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:800">Mia</div>
        <div style="font-size:12.5px;color:#4F7A63;font-weight:600;display:flex;align-items:center;gap:4px">
          <span style="width:5px;height:5px;border-radius:50%;background:#4F7A63"></span>{{ t_mia_subtitle }}
        </div>
      </div>
      <div style="position:relative;flex-shrink:0">
        <button aria-label="{{ t_language_aria }}" onClick="{{ toggleLangPicker }}" style="width:32px;height:32px;border-radius:50%;background:{{ glassBg }};border:1px solid {{ hairline }};display:flex;align-items:center;justify-content:center;cursor:pointer;color:{{ textPrimary }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18" stroke="currentColor" stroke-width="1.7"/><path d="M12 3c2.4 2.6 3.8 5.9 3.8 9s-1.4 6.4-3.8 9c-2.4-2.6-3.8-5.9-3.8-9s1.4-6.4 3.8-9z" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
      </div>
      <button aria-label="{{ t_toggle_dark_mode }}" onClick="{{ toggleDark }}" style="width:32px;height:32px;border-radius:50%;background:{{ glassBg }};border:1px solid {{ hairline }};display:flex;align-items:center;justify-content:center;cursor:pointer;color:{{ textPrimary }};flex-shrink:0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
      <a href="KindFare Home Redesign.dc.html" aria-label="{{ t_close }}" style="width:32px;height:32px;border-radius:50%;background:{{ glassBg }};border:1px solid {{ hairline }};display:flex;align-items:center;justify-content:center;cursor:pointer;color:{{ textPrimary }};flex-shrink:0;text-decoration:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
    </div>
  </div>

  <!-- messages -->
  <div style="position:absolute;z-index:1;inset:135px 0 150px 0;overflow-y:auto;padding:18px 20px">

    <div style="text-align:center;font-size:11.5px;font-weight:700;color:{{ textSecondary }};text-transform:uppercase;letter-spacing:.4px;margin-bottom:16px">{{ t_today_time }}</div>

    <div style="max-width:84%;background:{{ bubbleBg }};border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px;line-height:1.5;font-weight:500;margin-bottom:4px">
      {{ t_msg1 }}
    </div>
    <div style="font-size:11px;color:{{ textSecondary }};font-weight:600;margin-bottom:16px">2:14 PM</div>

    <div style="max-width:78%;margin-left:auto;background:#4A6B8A;color:#fff;border-radius:16px 16px 4px 16px;padding:12px 14px;font-size:14px;line-height:1.5;font-weight:500;margin-bottom:4px">
      {{ t_msg2 }}
    </div>
    <div style="text-align:right;font-size:11px;color:{{ textSecondary }};font-weight:600;margin-bottom:16px">2:15 PM</div>

    <div style="max-width:88%;background:{{ glassBgStrong }};border:1px solid {{ hairline }};border-radius:18px;padding:16px;margin-bottom:6px;box-shadow:0 10px 22px rgba(0,0,0,.08)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="width:26px;height:26px;border-radius:9px;background:rgba(217,136,22,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M7 3v8M11 3v8M7 7h4M11 11c0 3-2 4-2 8M17 3v18M17 3c-2 0-3 1.5-3 4s1 4 3 4" stroke="#d98816" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span style="font-size:12px;font-weight:700;color:{{ textSecondary }};text-transform:uppercase;letter-spacing:.3px">{{ t_protein_boost_idea }}</span>
      </div>
      <div style="font-size:14px;line-height:1.5;font-weight:500">{{ t_msg3 }}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <a href="KindFare Plan Redesign.dc.html" style="flex:1;text-align:center;font-size:13px;font-weight:700;color:#fff;background:#4A6B8A;border:none;border-radius:12px;padding:10px;cursor:pointer;text-decoration:none;box-sizing:border-box">{{ t_add_greek_yoghurt }}</a>
        <button onClick="{{ onTap }}" style="flex:1;font-size:13px;font-weight:700;color:#4A6B8A;background:{{ pillBg }};border:1px solid rgba(74,107,138,.25);border-radius:12px;padding:10px;cursor:pointer">{{ t_something_else }}</button>
      </div>
    </div>
    <div style="font-size:11px;color:{{ textSecondary }};font-weight:600;margin-bottom:16px">2:15 PM</div>

    <div style="max-width:78%;margin-left:auto;background:#4A6B8A;color:#fff;border-radius:16px 16px 4px 16px;padding:12px 14px;font-size:14px;line-height:1.5;font-weight:500;margin-bottom:4px">
      {{ t_msg4 }}
    </div>
    <div style="text-align:right;font-size:11px;color:{{ textSecondary }};font-weight:600;margin-bottom:16px">2:16 PM</div>

    <div style="display:inline-flex;align-items:center;gap:5px;background:{{ bubbleBg }};border-radius:16px 16px 16px 4px;padding:14px 16px">
      <span style="width:6px;height:6px;border-radius:50%;background:{{ textSecondary }};opacity:.5;animation:kf-typing 1.2s ease-in-out infinite"></span>
      <span style="width:6px;height:6px;border-radius:50%;background:{{ textSecondary }};opacity:.5;animation:kf-typing 1.2s ease-in-out .2s infinite"></span>
      <span style="width:6px;height:6px;border-radius:50%;background:{{ textSecondary }};opacity:.5;animation:kf-typing 1.2s ease-in-out .4s infinite"></span>
    </div>

    <div style="margin-top:22px;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:11.5px;font-weight:700;color:{{ textSecondary }};text-transform:uppercase;letter-spacing:.3px">{{ t_or_ask_mia }}</div>
      <div style="display:flex;gap:8px;overflow-x:auto">
        <button onClick="{{ onTap }}" style="flex-shrink:0;font-size:13px;font-weight:600;color:{{ textPrimary }};background:{{ glassBgStrong }};border:1px solid {{ hairline }};border-radius:999px;padding:9px 14px;cursor:pointer">{{ t_chip_week }}</button>
        <button onClick="{{ onTap }}" style="flex-shrink:0;font-size:13px;font-weight:600;color:{{ textPrimary }};background:{{ glassBgStrong }};border:1px solid {{ hairline }};border-radius:999px;padding:9px 14px;cursor:pointer">{{ t_chip_stretch }}</button>
        <button onClick="{{ onTap }}" style="flex-shrink:0;font-size:13px;font-weight:600;color:{{ textPrimary }};background:{{ glassBgStrong }};border:1px solid {{ hairline }};border-radius:999px;padding:9px 14px;cursor:pointer">{{ t_chip_goal }}</button>
      </div>
    </div>

    <sc-if value="{{ hasSent }}" hint-placeholder-val="{{ false }}">
    <div style="max-width:78%;margin-left:auto;background:#4A6B8A;color:#fff;border-radius:16px 16px 4px 16px;padding:12px 14px;font-size:14px;line-height:1.5;font-weight:500;margin-top:16px;margin-bottom:4px">{{ sentText }}</div>
    <div style="text-align:right;font-size:11px;color:{{ textSecondary }};font-weight:600">{{ t_just_now }}</div>
    </sc-if>

  </div>

  <!-- input bar -->
  <div style="position:absolute;z-index:2;left:0;right:0;bottom:0;padding:12px 16px 28px;background:{{ glassBg }};backdrop-filter:blur(24px) saturate(160%);border-top:1px solid {{ hairline }}">
    <div style="display:flex;align-items:center;gap:8px">
      <input type="text" value="{{ draftText }}" onChange="{{ onDraftChange }}" onKeyDown="{{ onDraftKeyDown }}" placeholder="{{ t_ask_mia_placeholder }}" aria-label="{{ t_ask_mia_placeholder }}" style="flex:1;height:46px;border-radius:999px;background:{{ glassBgStrong }};border:1px solid {{ hairline }};padding:0 16px;font-size:14px;color:{{ textPrimary }};font-weight:500;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif"/>
      <button aria-label="{{ t_voice_input }}" onClick="{{ onTap }}" style="width:46px;height:46px;border-radius:50%;background:{{ glassBgStrong }};border:1px solid {{ hairline }};display:flex;align-items:center;justify-content:center;cursor:pointer;color:{{ textPrimary }};flex-shrink:0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button aria-label="{{ t_send }}" onClick="{{ onSend }}" style="width:46px;height:46px;border-radius:50%;background:#4A6B8A;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div style="text-align:center;font-size:11px;font-weight:600;color:{{ textSecondary }};letter-spacing:.2px;line-height:1.4;padding:10px 14px 0">{{ t_preview_disclaimer }}</div>
  </div>


    <sc-if value="{{ langPickerOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;z-index:100;background:{{ outerBg }}">
        <div style="position:absolute;inset:0;z-index:1;overflow-y:auto;box-sizing:border-box;padding:54px 20px 40px">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:24px">
            <button aria-label="Back" onClick="{{ toggleLangPicker }}" style="width:36px;height:36px;border-radius:50%;background:{{ glassBg }};border:1px solid {{ hairline }};display:flex;align-items:center;justify-content:center;cursor:pointer;color:{{ textPrimary }};flex-shrink:0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h1 style="font-size:22px;font-weight:700;letter-spacing:-.3px;font-family:ui-serif,Georgia,serif;margin:0;color:{{ textPrimary }}">{{ t_choose_language }}</h1>
          </div>
          <div style="display:flex;flex-direction:column;gap:9px">
            <button onClick="{{ setLangEn }}" style="width:100%;text-align:left;padding:17px 18px;border-radius:16px;border:1px solid {{ hairline }};background:{{ langEnBg }};color:{{ textPrimary }};font-size:15.5px;font-weight:600;cursor:pointer">English</button>
            <button onClick="{{ setLangPt }}" style="width:100%;text-align:left;padding:17px 18px;border-radius:16px;border:1px solid {{ hairline }};background:{{ langPtBg }};color:{{ textPrimary }};font-size:15.5px;font-weight:600;cursor:pointer">Português</button>
            <button onClick="{{ setLangHi }}" style="width:100%;text-align:left;padding:17px 18px;border-radius:16px;border:1px solid {{ hairline }};background:{{ langHiBg }};color:{{ textPrimary }};font-size:15.5px;font-weight:600;cursor:pointer;font-family:'Noto Sans Devanagari','Inter',sans-serif">हिन्दी</button>
            <button onClick="{{ setLangEs }}" style="width:100%;text-align:left;padding:17px 18px;border-radius:16px;border:1px solid {{ hairline }};background:{{ langEsBg }};color:{{ textPrimary }};font-size:15.5px;font-weight:600;cursor:pointer">Español</button>
            <button onClick="{{ setLangFr }}" style="width:100%;text-align:left;padding:17px 18px;border-radius:16px;border:1px solid {{ hairline }};background:{{ langFrBg }};color:{{ textPrimary }};font-size:15.5px;font-weight:600;cursor:pointer">Français</button>
            <button onClick="{{ setLangUr }}" style="width:100%;text-align:left;padding:17px 18px;border-radius:16px;border:1px solid {{ hairline }};background:{{ langUrBg }};color:{{ textPrimary }};font-size:15.5px;font-weight:600;cursor:pointer;font-family:'Noto Nastaliq Urdu','Inter',sans-serif">اردو</button>
          </div>

          <button onClick="{{ confirmLangPicker }}" style="width:100%;margin-top:18px;padding:16px;border-radius:16px;border:none;background:#4A6B8A;color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 10px 22px rgba(74,107,138,.28)">{{ t_done }}</button>

          <!-- rotating globe — decorative, animation only, purely on the language picker page -->
          <div style="display:flex;justify-content:center;margin-top:32px;perspective:600px">
            <div style="width:46px;height:46px;animation:kf-globe-spin 5s linear infinite;transform-style:preserve-3d">
              <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="#4A6B8A" stroke-width="1.4"/>
                <ellipse cx="12" cy="12" rx="3.6" ry="9" stroke="#4A6B8A" stroke-width="1.2"/>
                <ellipse cx="12" cy="12" rx="7.2" ry="9" stroke="#4A6B8A" stroke-width="1.2"/>
                <path d="M3 12h18" stroke="#4A6B8A" stroke-width="1.2"/>
                <path d="M4.5 7.5h15" stroke="#4A6B8A" stroke-width="1"/>
                <path d="M4.5 16.5h15" stroke="#4A6B8A" stroke-width="1"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { dark: false, draftText: '', sentText: '', hasSent: false, lang: (window.KindFareI18n ? KindFareI18n.getLang() : 'en'), langPickerOpen: false, pendingLang: null };
  sendDraft() {
    const text = (this.state.draftText || '').trim();
    if (!text) return;
    if (window.KindFareSound) window.KindFareSound.miaMessage();
    this.setState({ sentText: text, hasSent: true, draftText: '' });
  }
  renderVals() {
    const d = this.state.dark;
    const lang = this.state.lang;
    const selLang = this.state.pendingLang ?? lang;
    const t = (key) => window.KindFareI18n ? KindFareI18n.t(key, lang) : key;
    const seg = (active) => active ? { bg: 'rgba(74,107,138,.14)' } : { bg: 'transparent' };
    let userFirstName = 'Dana';
    try { const n = localStorage.getItem('kf_name'); if (n && n.trim()) userFirstName = n.trim(); } catch (e) {}
    return {
      dark: d,
      userFirstName,
      toggleDark: () => { if (window.KindFareSound) window.KindFareSound.tap(); this.setState(s => ({ dark: !s.dark })); },
      onTap: () => { if (window.KindFareSound) window.KindFareSound.tap(); },
      draftText: this.state.draftText,
      onDraftChange: (e) => this.setState({ draftText: e.target.value }),
      onDraftKeyDown: (e) => { if (e.key === 'Enter') this.sendDraft(); },
      hasSent: this.state.hasSent,
      sentText: this.state.sentText,
      onSend: () => this.sendDraft(),
      lang,
      langPickerOpen: this.state.langPickerOpen,
      toggleLangPicker: () => { if (window.KindFareSound) window.KindFareSound.tap(); this.setState(s => ({ langPickerOpen: !s.langPickerOpen, pendingLang: null })); },
      setLangEn: () => { if (window.KindFareSound) window.KindFareSound.tap(); this.setState({ pendingLang: 'en' }); },
      setLangPt: () => { if (window.KindFareSound) window.KindFareSound.tap(); this.setState({ pendingLang: 'pt' }); },
      setLangHi: () => { if (window.KindFareSound) window.KindFareSound.tap(); this.setState({ pendingLang: 'hi' }); },
      setLangEs: () => { if (window.KindFareSound) window.KindFareSound.tap(); this.setState({ pendingLang: 'es' }); },
      setLangFr: () => { if (window.KindFareSound) window.KindFareSound.tap(); this.setState({ pendingLang: 'fr' }); },
      setLangUr: () => { if (window.KindFareSound) window.KindFareSound.tap(); this.setState({ pendingLang: 'ur' }); },
      confirmLangPicker: () => { const nl = this.state.pendingLang || lang; if (window.KindFareI18n) KindFareI18n.setLang(nl); if (window.KindFareSound) window.KindFareSound.success(); this.setState({ lang: nl, langPickerOpen: false, pendingLang: null }); },
      langEnBg: seg(selLang === 'en').bg,
      langPtBg: seg(selLang === 'pt').bg,
      langHiBg: seg(selLang === 'hi').bg,
      langEsBg: seg(selLang === 'es').bg,
      langFrBg: seg(selLang === 'fr').bg,
      langUrBg: seg(selLang === 'ur').bg,
      t_language_aria: t('common.language_aria'),
      t_choose_language: t('common.choose_language'), t_done: t('common.done'),
      t_toggle_dark_mode: t('common.toggle_dark_mode'),
      t_close: t('mia.close'),
      t_mia_subtitle: t('mia.subtitle'),
      t_today_time: t('mia.today_time'),
      t_msg1: t('mia.msg1').replace('{name}', userFirstName),
      t_msg2: t('mia.msg2'),
      t_msg3: t('mia.msg3'),
      t_msg4: t('mia.msg4'),
      t_protein_boost_idea: t('mia.protein_boost_idea'),
      t_add_greek_yoghurt: t('mia.add_greek_yoghurt'),
      t_something_else: t('mia.something_else'),
      t_or_ask_mia: t('mia.or_ask_mia'),
      t_chip_week: t('mia.chip_week'),
      t_chip_stretch: t('mia.chip_stretch'),
      t_chip_goal: t('mia.chip_goal'),
      t_just_now: t('mia.just_now'),
      t_ask_mia_placeholder: t('mia.ask_placeholder'),
      t_voice_input: t('mia.voice_input'),
      t_send: t('mia.send'),
      t_preview_disclaimer: t('mia.preview_disclaimer'),
      outerBg: d
        ? 'radial-gradient(at 15% 8%,#211f2a 0,transparent 55%),radial-gradient(at 85% 5%,#201e1a 0,transparent 50%),radial-gradient(at 90% 85%,#1a1f22 0,transparent 55%),radial-gradient(at 10% 90%,#211f2a 0,transparent 50%),#1E1C18'

      outerBgSolid: d ? '#1E1C18' : '#F5F2EA',
      textPrimary: d ? '#F5F2EA' : '#1E1C18',
      textSecondary: d ? '#b3a899' : '#6B6050',
      hairline: d ? 'rgba(255,255,255,.12)' : 'rgba(30,28,24,.08)',

      bubbleBg: d ? 'rgba(255,255,255,.1)' : 'rgba(255,255,255,.85)',
      pillBg: d ? 'rgba(255,255,255,.1)' : '#fff',

    };
